name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Require tag to match package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/build.py --check-tag "$RELEASE_TAG"

  validate:
    name: Validate release on all platforms
    needs: version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to NuGet.org
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-ubuntu-latest
          path: artifacts/packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Check NuGet account configuration
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo 'Set the NUGET_USER repository or nuget environment variable to your NuGet.org username.' >&2
            exit 1
          fi
      - name: Obtain a short-lived NuGet API key through OIDC
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Publish packages and symbols
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push 'artifacts/packages/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

  github-release:
    name: Attach packages to a GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-ubuntu-latest
          path: artifacts/packages
      - name: Create release and attach the validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json id > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/packages/*.nupkg artifacts/packages/*.snupkg --clobber
          else
            release_flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              release_flags+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" \
              --verify-tag --title "ProTest $RELEASE_TAG" --generate-notes \
              "${release_flags[@]}" artifacts/packages/*.nupkg artifacts/packages/*.snupkg
          fi
